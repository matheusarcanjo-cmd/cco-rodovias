<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CCO Rodovias — Centro de Controle Operacional" />
    <title>CCO - Strata Engenharia</title>
    <script>
      // Aplica o tema salvo ANTES do React montar, evitando "flash" de tema errado
      (function () {
        const stored = localStorage.getItem("cco-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (stored === "dark" || (!stored && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
